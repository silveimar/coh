[project]
name = "coh-workspace"
version = "0.1.0"
description = "COH (Cognitive Operating Harness) - Local-first execution core for solo developers"
requires-python = ">=3.15"
readme = "README.md"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
execution-core = { workspace = true }
persistence = { workspace = true }
coh-archive = { workspace = true }
prose = { workspace = true }
mcp-adapter = { workspace = true }
application = { workspace = true }
coh-api = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["execution_core", "coh_archive", "persistence", "coh_prose", "coh_mcp", "coh_application", "coh_api"]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "apps/*/tests", "evals/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
markers = [
    "asyncio: mark test as async",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["packages/*/src", "apps/*/src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
