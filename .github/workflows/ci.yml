name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-packages
          uv pip install -e "packages/execution-core[dev]" -e "packages/persistence[dev]" -e "packages/archive[dev]" -e "packages/prose[dev]" -e "packages/mcp_adapter[dev]" -e "packages/application[dev]" -e "apps/api[dev]"

      - name: Run ruff lint
        run: uv run ruff check packages/execution-core packages/persistence packages/archive packages/prose packages/mcp_adapter packages/application apps/api

      - name: Run ruff format check
        run: uv run ruff format --check packages/execution-core packages/persistence packages/archive packages/prose packages/mcp_adapter packages/application apps/api

      - name: Run execution-core tests
        run: uv run pytest packages/execution-core/tests --cov=packages/execution-core/src --cov-report=xml --cov-report=term
      
      - name: Run persistence tests
        run: uv run pytest packages/persistence/tests --cov=packages/persistence/src --cov-append --cov-report=xml --cov-report=term

      - name: Run archive tests
        run: uv run pytest packages/archive/tests --cov=packages/archive/src --cov-append --cov-report=xml --cov-report=term

      - name: Run prose tests
        run: uv run pytest packages/prose/tests --cov=packages/prose/src --cov-append --cov-report=xml --cov-report=term

      - name: Run mcp_adapter tests
        run: uv run pytest packages/mcp_adapter/tests --cov=packages/mcp_adapter/src --cov-append --cov-report=xml --cov-report=term

      - name: Run application tests
        run: uv run pytest packages/application/tests --cov=packages/application/src --cov-append --cov-report=xml --cov-report=term

      - name: Run api tests
        run: uv run pytest apps/api/tests --cov=apps/api/src --cov-append --cov-report=xml --cov-report=term

      - name: Run eval harness
        run: uv run pytest evals/tests --tb=short

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.xml
          flags: execution-core
