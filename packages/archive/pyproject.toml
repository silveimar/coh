[project]
name = "coh-archive"
version = "0.1.0"
description = "COH Markdown Archive - append-only interaction recording"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coh_archive"]
