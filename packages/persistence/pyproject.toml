[project]
name = "persistence"
version = "0.1.0"
description = "COH Persistence - SQLAlchemy/Alembic project-local state store"
requires-python = ">=3.12"
dependencies = [
    "execution-core",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persistence"]

[tool.uv.sources]
execution-core = { workspace = true }
