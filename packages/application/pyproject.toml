[project]
name = "application"
version = "0.1.0"
description = "COH Application Services - spec gate and foreground execution composition"
requires-python = ">=3.12"
dependencies = [
    "execution-core",
    "persistence",
    "coh-archive",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coh_application"]

[tool.uv.sources]
execution-core = { workspace = true }
persistence = { workspace = true }
coh-archive = { workspace = true }
