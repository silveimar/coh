[project]
name = "application"
version = "0.1.0"
description = "COH Application Services - spec gate and foreground execution composition"
requires-python = ">=3.15"
dependencies = [
    "execution-core",
    "persistence",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coh_application"]

[tool.uv.sources]
execution-core = { workspace = true }
persistence = { workspace = true }

[tool.deptry]
known_first_party = ["coh_application"]
