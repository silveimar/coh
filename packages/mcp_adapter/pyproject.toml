[project]
name = "mcp-adapter"
version = "0.1.0"
description = "COH MCP Adapter - Claude Code MCP server (D5)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[project.scripts]
coh-mcp = "coh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coh_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
execution-core = { workspace = true }
persistence = { workspace = true }
coh-archive = { workspace = true }
prose = { workspace = true }
