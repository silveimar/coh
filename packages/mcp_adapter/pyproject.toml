[project]
name = "mcp-adapter"
version = "0.1.0"
description = "COH MCP Adapter - Claude Code MCP server (D5)"
requires-python = ">=3.15"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.9.0",
    "execution-core",
    "coh-archive",
    "prose",
    "persistence",
    "application",
]

[project.scripts]
coh-mcp = "coh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coh_mcp"]

[tool.uv.sources]
execution-core = { workspace = true }
persistence = { workspace = true }
coh-archive = { workspace = true }
prose = { workspace = true }
application = { workspace = true }

[tool.deptry]
known_first_party = ["coh_mcp"]

[tool.deptry.package_module_name_map]
application = "coh_application"
prose = "coh_prose"

[tool.deptry.per_rule_ignores]
# Layer-rule violation, not a missing dependency: handlers.py has 4 inline
# `from sqlalchemy import select` sites, so MCP tools reach the database
# instead of calling application services (AGENTS.md hard rules;
# .planning/codebase/CONCERNS.md). Remove this ignore when that is fixed.
# Do not declare sqlalchemy in this package instead.
DEP003 = ["sqlalchemy"]
