[project]
name = "prose"
version = "0.1.0"
description = "COH Prose Rendering - P-01 through P-06 implementation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coh_prose"]
